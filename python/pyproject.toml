[project]
name = "finhack-pro"
version = "2.1.0"
description = "FinHack Pro 量化交易系统 - Python策略层与AI Agent系统"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "openai>=1.0",
    "anthropic>=0.18",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.11",
    "akshare>=1.12",
    "tushare>=1.4",
    "pyyaml>=6.0",
    "redis>=5.0",
    "websockets>=12.0",
    "loguru>=0.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finhack_pro*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
