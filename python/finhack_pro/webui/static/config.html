<!-- API配置页面模板 -->
<div class="fade-in space-y-4" x-data="configPage()">
    <!-- LLM配置 -->
    <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
        <h3 class="text-sm font-medium text-white mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            LLM配置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- OpenAI API Key -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">OpenAI API Key</label>
                <div class="relative">
                    <input type="password" x-model="config.llm.openai_api_key" placeholder="sk-..."
                           class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none pr-10">
                    <button @click="togglePassword($event)" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <button @click="testConnection('openai')" :disabled="testing.openai"
                        class="mt-1.5 text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                    <template x-if="!testing.openai"><span>测试连接</span></template>
                    <template x-if="testing.openai"><span class="spinner !w-3 !h-3 !border-2"></span></template>
                </button>
                <span x-show="testResults.openai" class="ml-2 text-xs" :class="testResults.openai?.success ? 'text-green-400' : 'text-red-400'" x-text="testResults.openai?.message"></span>
            </div>

            <!-- Anthropic API Key -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">Anthropic API Key</label>
                <div class="relative">
                    <input type="password" x-model="config.llm.anthropic_api_key" placeholder="sk-ant-..."
                           class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none pr-10">
                    <button @click="togglePassword($event)" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <button @click="testConnection('anthropic')" :disabled="testing.anthropic"
                        class="mt-1.5 text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                    <template x-if="!testing.anthropic"><span>测试连接</span></template>
                    <template x-if="testing.anthropic"><span class="spinner !w-3 !h-3 !border-2"></span></template>
                </button>
                <span x-show="testResults.anthropic" class="ml-2 text-xs" :class="testResults.anthropic?.success ? 'text-green-400' : 'text-red-400'" x-text="testResults.anthropic?.message"></span>
            </div>

            <!-- 模型选择 -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">模型选择</label>
                <select x-model="config.llm.model" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                    <option value="gpt-4">GPT-4</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                    <option value="claude-3-haiku-20240307">Claude 3 Haiku</option>
                </select>
            </div>

            <!-- Temperature -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">Temperature: <span x-text="config.llm.temperature" class="text-white"></span></label>
                <input type="range" x-model.number="config.llm.temperature" min="0" max="2" step="0.1"
                       class="w-full h-2 bg-[#334155] rounded-lg appearance-none cursor-pointer accent-blue-500">
                <div class="flex justify-between text-xs text-gray-600 mt-1">
                    <span>精确 (0)</span>
                    <span>创意 (2)</span>
                </div>
            </div>

            <!-- Max Tokens -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">Max Tokens</label>
                <input type="number" x-model.number="config.llm.max_tokens" min="1" max="128000"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>

            <!-- Provider -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">服务商</label>
                <select x-model="config.llm.provider" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 数据源配置 -->
    <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
        <h3 class="text-sm font-medium text-white mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            数据源配置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Tushare Token</label>
                <div class="relative">
                    <input type="password" x-model="config.data.tushare_token" placeholder="输入Tushare Token"
                           class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none pr-10">
                    <button @click="togglePassword($event)" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <button @click="testConnection('tushare')" :disabled="testing.tushare"
                        class="mt-1.5 text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                    <template x-if="!testing.tushare"><span>测试连接</span></template>
                    <template x-if="testing.tushare"><span class="spinner !w-3 !h-3 !border-2"></span></template>
                </button>
                <span x-show="testResults.tushare" class="ml-2 text-xs" :class="testResults.tushare?.success ? 'text-green-400' : 'text-red-400'" x-text="testResults.tushare?.message"></span>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">数据目录</label>
                <input type="text" x-model="config.data.data_dir" placeholder="./data"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
        </div>
    </div>

    <!-- 风控参数配置 -->
    <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
        <h3 class="text-sm font-medium text-white mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
            风控参数配置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">最大仓位比例 (%)</label>
                <input type="number" x-model.number="config.risk.max_position_pct" min="0" max="100" step="1"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">最大回撤限制 (%)</label>
                <input type="number" x-model.number="config.risk.max_drawdown_pct" min="0" max="100" step="1"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">日亏损限制 (%)</label>
                <input type="number" x-model.number="config.risk.max_daily_loss_pct" min="0" max="100" step="1"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">VaR置信度</label>
                <input type="number" x-model.number="config.risk.var_confidence" min="0" max="1" step="0.01"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">止损比例 (%)</label>
                <input type="number" x-model.number="config.risk.stop_loss_pct" min="0" max="100" step="1"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">止盈比例 (%)</label>
                <input type="number" x-model.number="config.risk.take_profit_pct" min="0" max="100" step="1"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
        </div>
    </div>

    <!-- 执行参数配置 -->
    <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
        <h3 class="text-sm font-medium text-white mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            执行参数配置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">滑点 (基点)</label>
                <input type="number" x-model.number="config.backtest.slippage" min="0" step="0.1"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">佣金率</label>
                <input type="number" x-model.number="config.backtest.commission_rate" min="0" step="0.0001"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">印花税率</label>
                <input type="number" x-model.number="config.backtest.stamp_tax_rate" min="0" step="0.0001"
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="flex gap-3">
        <button @click="saveConfig()" :disabled="saving"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 text-white text-sm rounded-lg transition-colors flex items-center gap-2">
            <template x-if="!saving">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </template>
            <template x-if="saving"><span class="spinner !w-4 !h-4 !border-2"></span></template>
            <span x-text="saving ? '保存中...' : '保存配置'"></span>
        </button>
        <button @click="resetConfig()"
                class="px-6 py-2 bg-[#334155] hover:bg-[#475569] text-white text-sm rounded-lg transition-colors">
            重置
        </button>
    </div>

    <!-- 策略分享 -->
    <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
        <h3 class="text-sm font-medium text-white mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            策略分享
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 分享策略 -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">分享当前策略配置</label>
                <button @click="shareStrategy()" :disabled="sharing"
                        class="w-full px-4 py-2 bg-purple-600 hover:bg-purple-700 disabled:bg-purple-800 text-white text-sm rounded-lg transition-colors flex items-center justify-center gap-2">
                    <template x-if="!sharing"><span>生成分享码</span></template>
                    <template x-if="sharing"><span class="spinner !w-4 !h-4 !border-2"></span></template>
                </button>
                <div x-show="shareCode" class="mt-2">
                    <label class="block text-xs text-gray-400 mb-1">分享码</label>
                    <div class="flex gap-2">
                        <input type="text" x-model="shareCode" readonly
                               class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-xs text-white font-mono">
                        <button @click="copyShareCode()" class="px-3 py-2 bg-[#334155] hover:bg-[#475569] text-white text-xs rounded-lg">
                            复制
                        </button>
                    </div>
                </div>
            </div>
            <!-- 导入策略 -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">导入分享的策略</label>
                <div class="flex gap-2">
                    <input type="text" x-model="importCode" placeholder="粘贴分享码..."
                           class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-xs text-white font-mono">
                    <button @click="importStrategy()" :disabled="importing || !importCode"
                            class="px-4 py-2 bg-green-600 hover:bg-green-700 disabled:bg-green-800 text-white text-xs rounded-lg transition-colors">
                        <template x-if="!importing"><span>导入</span></template>
                        <template x-if="importing"><span class="spinner !w-3 !h-3 !border-2"></span></template>
                    </button>
                </div>
                <p x-show="importError" class="mt-1 text-xs text-red-400" x-text="importError"></p>
                <p x-show="importSuccess" class="mt-1 text-xs text-green-400" x-text="importSuccess"></p>
            </div>
        </div>
    </div>
</div>
