<!-- 策略工坊页面模板 -->
<div class="fade-in space-y-4" x-data="workshopPage()">
    <!-- Tab导航 -->
    <div class="flex gap-2 mb-4 flex-wrap">
        <button @click="activeTab='ai_strategy'" :class="activeTab==='ai_strategy' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'" class="px-4 py-2 rounded-lg text-sm text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5M14.25 3.104c.251.023.501.05.75.082M19 14.5l-2.47 2.47a2.25 2.25 0 01-1.591.659H9.061a2.25 2.25 0 01-1.591-.659L5 14.5m14 0V17a2.25 2.25 0 01-2.25 2.25H7.25A2.25 2.25 0 015 17v-2.5"></path></svg>
            AI策略生成
        </button>
        <button @click="activeTab='ai_factor'" :class="activeTab==='ai_factor' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'" class="px-4 py-2 rounded-lg text-sm text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            AI因子生成
        </button>
        <button @click="activeTab='templates'" :class="activeTab==='templates' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'" class="px-4 py-2 rounded-lg text-sm text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            策略模板库
        </button>
        <button @click="activeTab='factor_editor'" :class="activeTab==='factor_editor' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'" class="px-4 py-2 rounded-lg text-sm text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
            因子编辑器
        </button>
    </div>

    <!-- ==================== AI策略生成 ==================== -->
    <div x-show="activeTab==='ai_strategy'" x-transition>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- 左侧：表单区 -->
            <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
                <h3 class="text-sm font-medium text-white mb-4">策略描述</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">策略描述</label>
                        <textarea x-model="strategyForm.description" rows="4" placeholder="例如：当RSI低于30且MACD金叉时买入，RSI高于70且MACD死叉时卖出，使用2%止损和5%止盈..."
                                  class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none resize-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">市场</label>
                            <select x-model="strategyForm.market" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="A">A股</option>
                                <option value="HK">港股</option>
                                <option value="US">美股</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">风格</label>
                            <select x-model="strategyForm.style" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="short">短线</option>
                                <option value="medium">中线</option>
                                <option value="long">长线</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">风险等级</label>
                            <select x-model="strategyForm.risk_level" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="low">低</option>
                                <option value="medium">中</option>
                                <option value="high">高</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">品种</label>
                            <select x-model="strategyForm.instrument" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="stock">股票</option>
                                <option value="futures">期货</option>
                                <option value="crypto">加密货币</option>
                            </select>
                        </div>
                    </div>
                    <button @click="generateStrategy()" :disabled="strategyGenerating || !strategyForm.description.trim()"
                            class="w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white text-sm rounded-lg transition-colors flex items-center justify-center gap-2">
                        <template x-if="!strategyGenerating">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </template>
                        <template x-if="strategyGenerating"><span class="spinner !w-4 !h-4 !border-2"></span></template>
                        <span x-text="strategyGenerating ? 'AI生成中...' : '生成策略'"></span>
                    </button>
                </div>
            </div>

            <!-- 右侧：结果区 -->
            <div class="space-y-4">
                <!-- 空状态 -->
                <div x-show="!strategyResult" class="bg-[#1e293b] rounded-lg p-8 border border-[#334155] text-center">
                    <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    <p class="text-sm text-gray-500">输入策略描述并点击"生成策略"，AI将为你生成策略代码</p>
                </div>

                <!-- 策略结果 -->
                <template x-if="strategyResult">
                    <div class="space-y-4">
                        <!-- 策略信息 -->
                        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="text-sm font-medium text-white" x-text="strategyResult.name"></h3>
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded text-xs bg-blue-900/50 text-blue-400" x-text="strategyResult.category"></span>
                                    <span class="px-2 py-0.5 rounded text-xs" :class="strategyResult.difficulty === '简单' ? 'bg-green-900/50 text-green-400' : strategyResult.difficulty === '中等' ? 'bg-yellow-900/50 text-yellow-400' : 'bg-red-900/50 text-red-400'" x-text="strategyResult.difficulty"></span>
                                </div>
                            </div>
                            <p class="text-xs text-gray-400 mb-3" x-text="strategyResult.description"></p>

                            <!-- 参数列表 -->
                            <div x-show="strategyResult.params && strategyResult.params.length > 0" class="mb-3">
                                <h4 class="text-xs text-gray-500 mb-2">参数列表</h4>
                                <table class="w-full text-xs">
                                    <thead>
                                        <tr class="text-gray-500 border-b border-[#334155]">
                                            <th class="text-left py-1.5 px-2">参数名</th>
                                            <th class="text-left py-1.5 px-2">默认值</th>
                                            <th class="text-left py-1.5 px-2">说明</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="param in strategyResult.params" :key="param.name">
                                            <tr class="border-b border-[#334155]/50">
                                                <td class="py-1.5 px-2 text-white font-mono" x-text="param.name"></td>
                                                <td class="py-1.5 px-2 text-blue-400 font-mono" x-text="param.default"></td>
                                                <td class="py-1.5 px-2 text-gray-400" x-text="param.desc"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <!-- 验证状态 -->
                            <div x-show="strategyResult.validated !== undefined" class="flex items-center gap-2 mb-3">
                                <template x-if="strategyResult.validated">
                                    <span class="flex items-center gap-1 text-xs text-green-400">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                        代码验证通过
                                    </span>
                                </template>
                                <template x-if="!strategyResult.validated">
                                    <span class="flex items-center gap-1 text-xs text-red-400">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        代码验证失败
                                    </span>
                                </template>
                            </div>

                            <!-- 操作按钮 -->
                            <div class="flex gap-2">
                                <button @click="copyCode(strategyResult.code)" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    复制代码
                                </button>
                                <button @click="saveStrategy()" class="px-3 py-1.5 bg-green-700 hover:bg-green-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                    保存到我的策略
                                </button>
                                <button @click="quickTest()" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                                    快速测试
                                </button>
                            </div>
                        </div>

                        <!-- 代码区 -->
                        <div class="bg-[#1e293b] rounded-lg border border-[#334155]">
                            <div class="flex items-center justify-between px-4 py-2 border-b border-[#334155]">
                                <span class="text-xs text-gray-400">策略代码</span>
                                <button @click="copyCode(strategyResult.code)" class="text-xs text-gray-500 hover:text-gray-300">复制</button>
                            </div>
                            <pre class="p-4 overflow-auto max-h-96 text-sm"><code class="text-green-400 font-mono whitespace-pre" x-text="strategyResult.code"></code></pre>
                        </div>

                        <!-- 快速测试结果（真实回测） -->
                        <div x-show="testRunning" class="bg-[#1e293b] rounded-lg border border-[#334155] p-4">
                            <div class="flex items-center gap-2 text-gray-400 text-sm">
                                <span class="spinner !w-4 !h-4 !border-2"></span>
                                正在使用真实行情回测，请稍候...
                            </div>
                        </div>

                        <div x-show="testError" class="bg-red-950/50 border border-red-800 rounded-lg p-4">
                            <p class="text-sm text-red-300" x-text="testError"></p>
                        </div>

                        <div x-show="testResult" class="bg-[#1e293b] rounded-lg border border-[#334155]">
                            <div class="px-4 py-2 border-b border-[#334155] flex items-center justify-between">
                                <span class="text-xs font-medium text-gray-300">回测结果（真实行情 600519.SH）</span>
                                <span class="text-[10px] text-gray-500">2024-01-01 ~ 2024-06-30</span>
                            </div>
                            <div class="p-4">
                                <div class="grid grid-cols-3 md:grid-cols-3 gap-3 mb-4">
                                    <div class="bg-[#0f172a] rounded-lg p-3">
                                        <p class="text-[10px] text-gray-500">总收益率</p>
                                        <p class="text-lg font-medium mt-1" :class="testResult.metrics.total_return >= 0 ? 'text-red-400' : 'text-green-400'" x-text="formatTestPct(testResult.metrics.total_return)"></p>
                                    </div>
                                    <div class="bg-[#0f172a] rounded-lg p-3">
                                        <p class="text-[10px] text-gray-500">夏普比率</p>
                                        <p class="text-lg font-medium mt-1 text-gray-200" x-text="formatTestNum(testResult.metrics.sharpe_ratio)"></p>
                                    </div>
                                    <div class="bg-[#0f172a] rounded-lg p-3">
                                        <p class="text-[10px] text-gray-500">最大回撤</p>
                                        <p class="text-lg font-medium mt-1 text-amber-400" x-text="formatTestPct(testResult.metrics.max_drawdown)"></p>
                                    </div>
                                    <div class="bg-[#0f172a] rounded-lg p-3">
                                        <p class="text-[10px] text-gray-500">胜率</p>
                                        <p class="text-lg font-medium mt-1 text-gray-200" x-text="formatTestPct(testResult.metrics.win_rate)"></p>
                                    </div>
                                    <div class="bg-[#0f172a] rounded-lg p-3">
                                        <p class="text-[10px] text-gray-500">交易次数</p>
                                        <p class="text-lg font-medium mt-1 text-gray-200" x-text="testResult.metrics.total_trades"></p>
                                    </div>
                                    <div class="bg-[#0f172a] rounded-lg p-3">
                                        <p class="text-[10px] text-gray-500">最终权益</p>
                                        <p class="text-lg font-medium mt-1 text-gray-200" x-text="formatMoney(testResult.metrics.final_equity)"></p>
                                    </div>
                                </div>
                                <div class="h-48">
                                    <canvas id="test-equity-chart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ==================== AI因子生成 ==================== -->
    <div x-show="activeTab==='ai_factor'" x-transition>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- 左侧：表单区 -->
            <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
                <h3 class="text-sm font-medium text-white mb-4">因子描述</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">因子描述</label>
                        <textarea x-model="factorForm.description" rows="4" placeholder="例如：计算过去20日收盘价的动量因子，衡量价格变化趋势..."
                                  class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none resize-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">数据类型</label>
                            <select x-model="factorForm.data_type" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="daily">日线</option>
                                <option value="minute">分钟线</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">因子类别</label>
                            <select x-model="factorForm.category" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="technical">技术</option>
                                <option value="fundamental">基本面</option>
                                <option value="sentiment">情绪</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                    </div>
                    <button @click="generateFactor()" :disabled="factorGenerating || !factorForm.description.trim()"
                            class="w-full px-4 py-2.5 bg-purple-600 hover:bg-purple-700 disabled:bg-purple-800 disabled:cursor-not-allowed text-white text-sm rounded-lg transition-colors flex items-center justify-center gap-2">
                        <template x-if="!factorGenerating">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </template>
                        <template x-if="factorGenerating"><span class="spinner !w-4 !h-4 !border-2"></span></template>
                        <span x-text="factorGenerating ? 'AI生成中...' : '生成因子'"></span>
                    </button>
                </div>
            </div>

            <!-- 右侧：结果区 -->
            <div class="space-y-4">
                <!-- 空状态 -->
                <div x-show="!factorResult" class="bg-[#1e293b] rounded-lg p-8 border border-[#334155] text-center">
                    <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    <p class="text-sm text-gray-500">输入因子描述并点击"生成因子"，AI将为你生成因子代码</p>
                </div>

                <!-- 因子结果 -->
                <template x-if="factorResult">
                    <div class="space-y-4">
                        <!-- 因子信息 -->
                        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="text-sm font-medium text-white" x-text="factorResult.name"></h3>
                                <span class="px-2 py-0.5 rounded text-xs bg-purple-900/50 text-purple-400" x-text="factorResult.category"></span>
                            </div>
                            <div class="mb-3">
                                <h4 class="text-xs text-gray-500 mb-1">计算公式</h4>
                                <code class="text-xs text-cyan-400 bg-[#0f172a] px-2 py-1 rounded" x-text="factorResult.formula"></code>
                            </div>
                            <div x-show="factorResult.description" class="mb-3">
                                <p class="text-xs text-gray-400" x-text="factorResult.description"></p>
                            </div>
                            <div class="flex gap-2">
                                <button @click="copyCode(factorResult.code)" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    复制代码
                                </button>
                                <button @click="saveFactor()" class="px-3 py-1.5 bg-green-700 hover:bg-green-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                    保存因子
                                </button>
                            </div>
                        </div>

                        <!-- 代码区 -->
                        <div class="bg-[#1e293b] rounded-lg border border-[#334155]">
                            <div class="flex items-center justify-between px-4 py-2 border-b border-[#334155]">
                                <span class="text-xs text-gray-400">因子代码</span>
                                <button @click="copyCode(factorResult.code)" class="text-xs text-gray-500 hover:text-gray-300">复制</button>
                            </div>
                            <pre class="p-4 overflow-auto max-h-96 text-sm"><code class="text-cyan-400 font-mono whitespace-pre" x-text="factorResult.code"></code></pre>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ==================== 策略模板库 ==================== -->
    <div x-show="activeTab==='templates'" x-transition>
        <!-- 筛选栏 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155] mb-4">
            <div class="flex items-center gap-3 flex-wrap">
                <span class="text-xs text-gray-400">筛选:</span>
                <select x-model="templateFilters.category" @change="loadTemplates()" class="bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                    <option value="">全部分类</option>
                    <option value="trend">趋势跟踪</option>
                    <option value="mean_reversion">均值回归</option>
                    <option value="breakout">突破</option>
                    <option value="momentum">动量</option>
                    <option value="volatility">波动率</option>
                </select>
                <select x-model="templateFilters.style" @change="loadTemplates()" class="bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                    <option value="">全部风格</option>
                    <option value="short">短线</option>
                    <option value="medium">中线</option>
                    <option value="long">长线</option>
                </select>
                <select x-model="templateFilters.difficulty" @change="loadTemplates()" class="bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                    <option value="">全部难度</option>
                    <option value="easy">简单</option>
                    <option value="medium">中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
        </div>

        <!-- 模板卡片网格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="tpl in filteredTemplates" :key="tpl.id">
                <div @click="selectTemplate(tpl.id)"
                     class="bg-[#1e293b] rounded-lg p-4 border cursor-pointer transition-all duration-200"
                     :class="selectedTemplate && selectedTemplate.id === tpl.id ? 'border-blue-500 -translate-y-1 shadow-lg shadow-blue-500/10' : 'border-[#334155] hover:border-blue-500/50 hover:-translate-y-0.5'">
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="text-sm font-medium text-white" x-text="tpl.name"></h4>
                        <div class="flex items-center gap-0.5">
                            <template x-for="n in 3" :key="n">
                                <svg class="w-3 h-3" :class="n <= tpl.difficulty_level ? 'text-yellow-400' : 'text-gray-600'" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            </template>
                        </div>
                    </div>
                    <span class="inline-block px-2 py-0.5 rounded text-xs bg-blue-900/50 text-blue-400 mb-2" x-text="tpl.category_label"></span>
                    <p class="text-xs text-gray-400 line-clamp-2 mb-3" x-text="tpl.description"></p>
                    <div class="flex flex-wrap gap-1">
                        <template x-for="tag in tpl.tags" :key="tag">
                            <span class="px-1.5 py-0.5 rounded text-xs bg-[#0f172a] text-gray-500" x-text="tag"></span>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- 模板详情 -->
        <template x-if="selectedTemplate">
            <div class="mt-4 bg-[#1e293b] rounded-lg border border-blue-500/50 overflow-hidden">
                <div class="px-4 py-3 border-b border-[#334155] flex items-center justify-between">
                    <h3 class="text-sm font-medium text-white" x-text="selectedTemplate.name"></h3>
                    <button @click="selectedTemplate = null" class="text-gray-500 hover:text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="p-4 space-y-4">
                    <!-- 完整描述 -->
                    <div>
                        <h4 class="text-xs text-gray-500 mb-1">策略描述</h4>
                        <p class="text-sm text-gray-300" x-text="selectedTemplate.full_description"></p>
                    </div>

                    <!-- 参数表 -->
                    <div x-show="selectedTemplate.params && selectedTemplate.params.length > 0">
                        <h4 class="text-xs text-gray-500 mb-2">参数配置</h4>
                        <table class="w-full text-xs">
                            <thead>
                                <tr class="text-gray-500 border-b border-[#334155]">
                                    <th class="text-left py-1.5 px-2">参数名</th>
                                    <th class="text-left py-1.5 px-2">默认值</th>
                                    <th class="text-left py-1.5 px-2">范围</th>
                                    <th class="text-left py-1.5 px-2">说明</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="param in selectedTemplate.params" :key="param.name">
                                    <tr class="border-b border-[#334155]/50">
                                        <td class="py-1.5 px-2 text-white font-mono" x-text="param.name"></td>
                                        <td class="py-1.5 px-2 text-blue-400 font-mono" x-text="param.default"></td>
                                        <td class="py-1.5 px-2 text-gray-400" x-text="param.range || '-'"></td>
                                        <td class="py-1.5 px-2 text-gray-400" x-text="param.desc"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- 使用说明 -->
                    <div x-show="selectedTemplate.usage">
                        <h4 class="text-xs text-gray-500 mb-1">使用说明</h4>
                        <p class="text-xs text-gray-400" x-text="selectedTemplate.usage"></p>
                    </div>

                    <!-- 代码块 -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="text-xs text-gray-500">策略代码</h4>
                            <button @click="copyCode(selectedTemplate.code)" class="text-xs text-gray-500 hover:text-gray-300">复制</button>
                        </div>
                        <pre class="bg-[#0f172a] rounded-lg p-4 overflow-auto max-h-80 text-sm border border-[#334155]"><code class="text-green-400 font-mono whitespace-pre" x-text="selectedTemplate.code"></code></pre>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="flex gap-2">
                        <button @click="copyCode(selectedTemplate.code)" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            复制代码
                        </button>
                        <button @click="saveStrategy()" class="px-3 py-1.5 bg-green-700 hover:bg-green-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                            保存到我的策略
                        </button>
                        <button @click="quickTest()" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                            快速测试
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- ==================== 因子编辑器 ==================== -->
    <div x-show="activeTab==='factor_editor'" x-transition>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- 左侧：表单 -->
            <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
                <h3 class="text-sm font-medium text-white mb-4">因子配置</h3>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">因子名称</label>
                            <input type="text" x-model="editorForm.name" placeholder="例如：momentum_20d"
                                   class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">因子类别</label>
                            <select x-model="editorForm.category" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                <option value="technical">技术</option>
                                <option value="fundamental">基本面</option>
                                <option value="sentiment">情绪</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">因子描述</label>
                        <textarea x-model="editorForm.description" rows="2" placeholder="描述因子的用途和计算逻辑..."
                                  class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">输出类型</label>
                        <select x-model="editorForm.output_type" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                            <option value="numeric">数值</option>
                            <option value="signal">信号</option>
                            <option value="score">评分</option>
                        </select>
                    </div>

                    <!-- 动态参数列表 -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs text-gray-400">参数列表</label>
                            <button @click="addParam()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                添加参数
                            </button>
                        </div>
                        <div class="space-y-2">
                            <template x-for="(param, idx) in editorParams" :key="idx">
                                <div class="flex items-center gap-2">
                                    <input type="text" x-model="param.name" placeholder="名称" class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                    <input type="text" x-model="param.label" placeholder="标签" class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                    <select x-model="param.type" class="bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                        <option value="int">int</option>
                                        <option value="float">float</option>
                                        <option value="str">str</option>
                                        <option value="bool">bool</option>
                                    </select>
                                    <input type="text" x-model="param.default" placeholder="默认值" class="w-20 bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                    <button @click="removeParam(idx)" class="text-red-400 hover:text-red-300 flex-shrink-0">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </template>
                            <div x-show="editorParams.length === 0" class="text-xs text-gray-600 text-center py-2">暂无参数，点击"添加参数"</div>
                        </div>
                    </div>

                    <!-- 计算公式 -->
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">计算公式</label>
                        <textarea x-model="editorForm.formula" rows="3" placeholder="bars[-1].close / bars[-21].close - 1"
                                  class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-cyan-400 font-mono focus:border-blue-500 focus:outline-none resize-none"></textarea>
                    </div>

                    <!-- 动态条件列表 -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs text-gray-400">过滤条件</label>
                            <button @click="addCondition()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                添加条件
                            </button>
                        </div>
                        <div class="space-y-2">
                            <template x-for="(cond, idx) in editorConditions" :key="idx">
                                <div class="flex items-center gap-2">
                                    <select x-model="cond.field" class="bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                        <option value="open">open</option>
                                        <option value="high">high</option>
                                        <option value="low">low</option>
                                        <option value="close">close</option>
                                        <option value="volume">volume</option>
                                    </select>
                                    <select x-model="cond.operator" class="bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                        <option value=">">&gt;</option>
                                        <option value="<">&lt;</option>
                                        <option value=">=">&gt;=</option>
                                        <option value="<=">&lt;=</option>
                                        <option value="==">==</option>
                                    </select>
                                    <input type="text" x-model="cond.value" placeholder="值" class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-2 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
                                    <button @click="removeCondition(idx)" class="text-red-400 hover:text-red-300 flex-shrink-0">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </template>
                            <div x-show="editorConditions.length === 0" class="text-xs text-gray-600 text-center py-2">暂无条件，点击"添加条件"</div>
                        </div>
                    </div>

                    <button @click="generateFactorCode()" :disabled="editorGenerating || !editorForm.name.trim()"
                            class="w-full px-4 py-2.5 bg-amber-600 hover:bg-amber-700 disabled:bg-amber-800 disabled:cursor-not-allowed text-white text-sm rounded-lg transition-colors flex items-center justify-center gap-2">
                        <template x-if="!editorGenerating">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        </template>
                        <template x-if="editorGenerating"><span class="spinner !w-4 !h-4 !border-2"></span></template>
                        <span x-text="editorGenerating ? '生成中...' : '生成代码'"></span>
                    </button>
                </div>
            </div>

            <!-- 右侧：代码预览 + 验证 -->
            <div class="space-y-4">
                <!-- 空状态 -->
                <div x-show="!editorCode" class="bg-[#1e293b] rounded-lg p-8 border border-[#334155] text-center">
                    <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
                    <p class="text-sm text-gray-500">填写因子配置并点击"生成代码"，将自动生成因子代码</p>
                </div>

                <!-- 代码预览 -->
                <template x-if="editorCode">
                    <div class="space-y-4">
                        <!-- 验证结果 -->
                        <div x-show="editorValidation" class="bg-[#1e293b] rounded-lg p-3 border"
                             :class="editorValidation.valid ? 'border-green-600/50' : 'border-red-600/50'">
                            <div class="flex items-center gap-2">
                                <template x-if="editorValidation.valid">
                                    <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </template>
                                <template x-if="!editorValidation.valid">
                                    <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </template>
                                <span class="text-xs" :class="editorValidation.valid ? 'text-green-400' : 'text-red-400'" x-text="editorValidation.message"></span>
                            </div>
                        </div>

                        <!-- 代码块 -->
                        <div class="bg-[#1e293b] rounded-lg border border-[#334155]">
                            <div class="flex items-center justify-between px-4 py-2 border-b border-[#334155]">
                                <span class="text-xs text-gray-400">生成代码</span>
                                <button @click="copyCode(editorCode)" class="text-xs text-gray-500 hover:text-gray-300">复制</button>
                            </div>
                            <pre class="p-4 overflow-auto max-h-[500px] text-sm"><code class="text-amber-400 font-mono whitespace-pre" x-text="editorCode"></code></pre>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="flex gap-2">
                            <button @click="copyCode(editorCode)" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                复制代码
                            </button>
                            <button @click="saveFactor()" class="px-3 py-1.5 bg-green-700 hover:bg-green-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                保存因子
                            </button>
                            <button @click="validateCode(editorCode)" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 text-white text-xs rounded-lg transition-colors flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                验证代码
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
