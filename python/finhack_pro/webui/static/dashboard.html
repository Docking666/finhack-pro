<!-- 仪表盘页面模板 -->
<div class="fade-in space-y-4">
    <!-- 概览卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Agent数量 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs text-gray-500">Agent数量</div>
                    <div class="text-2xl font-bold text-white mt-1" x-text="systemInfo.agent_count">6</div>
                </div>
                <div class="w-10 h-10 bg-blue-600/20 rounded-lg flex items-center justify-center text-blue-400 text-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
            </div>
        </div>

        <!-- 记忆条数 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs text-gray-500">记忆条数</div>
                    <div class="text-2xl font-bold text-white mt-1" x-text="memoryStats.total_memories">0</div>
                </div>
                <div class="w-10 h-10 bg-purple-600/20 rounded-lg flex items-center justify-center text-purple-400 text-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>
                </div>
            </div>
        </div>

        <!-- 工具数 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs text-gray-500">可用工具</div>
                    <div class="text-2xl font-bold text-white mt-1" x-text="systemInfo.tool_count">7</div>
                </div>
                <div class="w-10 h-10 bg-green-600/20 rounded-lg flex items-center justify-center text-green-400 text-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
            </div>
        </div>

        <!-- 回测次数 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs text-gray-500">回测次数</div>
                    <div class="text-2xl font-bold text-white mt-1" x-text="backtestHistory.length">0</div>
                </div>
                <div class="w-10 h-10 bg-orange-600/20 rounded-lg flex items-center justify-center text-orange-400 text-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- 快速操作 + 系统健康 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <!-- 快速操作 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <h3 class="text-sm font-medium text-white mb-3">快速操作</h3>
            <div class="space-y-2">
                <button @click="navigate('agents'); setTimeout(() => { if(typeof runPipeline === 'function') runPipeline(); }, 300)"
                        class="w-full flex items-center gap-2 px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                    运行分析流水线
                </button>
                <button @click="navigate('backtest')"
                        class="w-full flex items-center gap-2 px-3 py-2 bg-[#334155] hover:bg-[#475569] text-white text-sm rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    启动回测
                </button>
                <button @click="navigate('config')"
                        class="w-full flex items-center gap-2 px-3 py-2 bg-[#334155] hover:bg-[#475569] text-white text-sm rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    系统配置
                </button>
            </div>
        </div>

        <!-- 系统健康状态 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <h3 class="text-sm font-medium text-white mb-3">系统健康状态</h3>
            <div class="space-y-2">
                <template x-for="(status, name) in healthComponents" :key="name">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-400" x-text="formatComponentName(name)"></span>
                        <span class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full" :class="status === 'healthy' ? 'bg-green-500' : status === 'degraded' ? 'bg-yellow-500' : 'bg-red-500'"></span>
                            <span :class="status === 'healthy' ? 'text-green-400' : status === 'degraded' ? 'text-yellow-400' : 'text-red-400'" x-text="status === 'healthy' ? '正常' : status === 'degraded' ? '降级' : '异常'"></span>
                        </span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Agent状态概览 -->
        <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
            <h3 class="text-sm font-medium text-white mb-3">Agent状态</h3>
            <div class="space-y-2" x-show="agentList.length > 0">
                <template x-for="agent in agentList.slice(0, 6)" :key="agent.agent_id">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-400" x-text="agent.name"></span>
                        <span class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full" :class="agent.status === 'running' ? 'bg-green-500' : 'bg-gray-500'"></span>
                            <span :class="agent.status === 'running' ? 'text-green-400' : 'text-gray-500'" x-text="agent.status === 'running' ? '运行中' : '空闲'"></span>
                        </span>
                    </div>
                </template>
            </div>
            <div x-show="agentList.length === 0" class="text-sm text-gray-500">加载中...</div>
        </div>
    </div>

    <!-- 最近流水线执行记录 -->
    <div class="bg-[#1e293b] rounded-lg p-4 border border-[#334155]">
        <h3 class="text-sm font-medium text-white mb-3">最近流水线执行</h3>
        <div x-show="pipelineHistory.length > 0">
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-gray-500 text-xs border-b border-[#334155]">
                        <th class="text-left py-2 px-2">时间</th>
                        <th class="text-left py-2 px-2">标的</th>
                        <th class="text-left py-2 px-2">步骤完成</th>
                        <th class="text-left py-2 px-2">状态</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="record in pipelineHistory.slice(-5).reverse()" :key="record.run_id">
                        <tr class="border-b border-[#334155]/50 hover:bg-[#334155]/30">
                            <td class="py-2 px-2 text-gray-400" x-text="formatTime(record.start_time)"></td>
                            <td class="py-2 px-2 text-white font-mono" x-text="record.symbol"></td>
                            <td class="py-2 px-2 text-gray-400" x-text="record.steps_completed + '/6'"></td>
                            <td class="py-2 px-2">
                                <span class="px-2 py-0.5 rounded text-xs"
                                      :class="record.status === 'completed' ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'"
                                      x-text="record.status === 'completed' ? '完成' : '失败'"></span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <div x-show="pipelineHistory.length === 0" class="text-sm text-gray-500 py-4 text-center">暂无执行记录</div>
    </div>
</div>
