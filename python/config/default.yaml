  max_total_position_pct: 0.8
  signal_confidence_threshold: 0.6
  stop_loss_pct: 0.05
  take_profit_pct: 0.1
  var_confidence: 0.95
rust_core:
  api_key: ''
  api_url: http://localhost:8080
  timeout: 30
  ws_url: ws://localhost:8081
workshop:
  # CloudBase 网关地址：/api/workshop 前缀由网关剥除，/api 前缀到达云函数 workshop-api
