agent:
  analysis_interval: 300
  market_analyzer_model: gpt-4o
  max_concurrent_symbols: 10
  risk_manager_model: gpt-4o
  strategy_generator_model: gpt-4o
  trade_executor_model: gpt-4o
agents: {}
backtest:
  benchmark: 000300.SH
  commission_rate: 0.0003
  initial_capital: 1000000.0
  slippage: 0.001
  stamp_tax_rate: 0.001
data:
  akshare_hist_api: tx
  cache_dir: data/cache
  custom_source: ''
  default_end: '2024-12-31'
  default_start: '2020-01-01'
  source: akshare
  sources:
  - baostock
  - akshare_sina
  - akshare_tx
  - akshare_em
  tushare_token: ''
environment: backtest
llm:
  anthropic_api_key: ''
  max_retries: 3
  max_tokens: 4096
  model: orcarouter/free
  openai_api_key: ''
  openai_base_url: https://api.orcarouter.ai/v1
  provider: openai
  temperature: 0.0
  timeout: 60
log_file: logs/finhack_pro.log
log_level: INFO
risk:
  initial_capital: 1000000.0
  max_daily_loss_pct: 0.05
  max_drawdown_pct: 0.15
