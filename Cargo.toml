[workspace]
resolver = "2"
members = [
    "crates/finhack-core",
    "crates/finhack-bus",
    "crates/finhack-risk",
    "crates/finhack-execution",
    "crates/finhack-backtest",
    "crates/finhack-data",
    "crates/finhack-api",
    "crates/finhack-bridge",
    "crates/finhack-pyo3",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
authors = ["FinHack Team"]
license = "MIT"
repository = "https://github.com/finhack-pro/finhack-pro"
description = "高性能多智能体量化交易系统核心引擎"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 错误处理
anyhow = "1"
thiserror = "1"

# 日志追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 配置管理
config = "0.14"

# HTTP服务
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 精确小数运算(金融计算必须)
rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"

# Python绑定(预留，后续启用)
# pyo3 = { version = "0.21", features = ["extension-module"] }

# 数据存储(预留，后续启用)
# redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
# sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "rust_decimal"] }

# 数据格式
csv = "1.3"
# parquet = "52"
# arrow = "52"

# WebSocket (axum已内置ws支持)
# tokio-tungstenite = "0.21"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 内部crate依赖
finhack-core = { path = "crates/finhack-core" }
finhack-bus = { path = "crates/finhack-bus" }
finhack-risk = { path = "crates/finhack-risk" }
finhack-execution = { path = "crates/finhack-execution" }
finhack-backtest = { path = "crates/finhack-backtest" }
finhack-data = { path = "crates/finhack-data" }
finhack-api = { path = "crates/finhack-api" }
