name: Build & Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build_cmd: build:win
            artifact_ext: exe
          - os: macos-latest
            platform: mac
            build_cmd: build:mac
            artifact_ext: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-build.txt

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd desktop
          npm install

      - name: Generate preset data
        run: python scripts/generate_preset_data.py

      - name: Build Python backend (PyInstaller)
        run: |
          cd python
          pyinstaller pyinstaller.spec --clean --noconfirm
        env:
          ${{ matrix.platform == 'win' && 'PYTHONUTF8' || 'PYTHONIOENCODING' }}: utf-8

      - name: Copy backend artifacts (Windows)
        if: matrix.platform == 'win'
        run: |
          if not exist "desktop\backend" mkdir "desktop\backend"
          xcopy /E /I /Y "python\dist\finhack-backend" "desktop\backend\finhack-backend"
        shell: cmd

      - name: Copy backend artifacts (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p desktop/backend
          cp -r python/dist/finhack-backend desktop/backend/finhack-backend

      - name: Build Electron app (${{ matrix.platform }})
        run: |
          cd desktop
          npm run ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            desktop/dist/*.${{ matrix.artifact_ext }}
            desktop/dist/*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-win
          path: dist/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-mac
          path: dist/mac

      - name: List downloaded artifacts
        run: find dist -type f | sort

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FinHack Pro v${{ inputs.version }}
          body: |
            ## FinHack Pro v${{ inputs.version }}

            ### Downloads
            - **Windows**: NSIS installer (`.exe`)
            - **macOS**: DMG image (`.dmg`)

            ### Installation
            - **Windows**: Download the `.exe` file and run it to install.
            - **macOS**: Download the `.dmg` file, open it, and drag the app to Applications.

            > **Note for macOS users**: If you see a "cannot be opened" warning,
            > right-click the app and select Open, or go to System Preferences >
            > Security & Privacy and allow the app.
          draft: false
          prerelease: false
          files: |
            dist/win/*.exe
            dist/mac/*.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
