name: Build & Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: false
        default: ''
        type: string
      release_type:
        description: 'Release type (major/minor/patch/auto)'
        required: false
        default: 'minor'
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build_cmd: build:win
            artifact_ext: exe
          - os: macos-latest
            platform: mac
            build_cmd: build:mac
            artifact_ext: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute and sync version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            CURRENT=$(grep '"version"' desktop/package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
            IFS='.' read -ra VER <<< "$CURRENT"
            MAJOR=${VER[0]:-2}
            MINOR=${VER[1]:-1}
            PATCH=${VER[2]:-0}
            case "${{ inputs.release_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              auto|*)
                DATE=$(date +'%Y%m%d')
                TIME=$(date +'%H%M')
                VERSION="${MAJOR}.${MINOR}.${PATCH}+${DATE}.${TIME}"
                echo "version=$VERSION" >> $GITHUB_OUTPUT
                echo "Generated version: $VERSION (auto)"
                exit 0
                ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
          export VERSION
          # 回写版本号到所有文件（使用 Python 替代 sed，兼容 Linux/macOS/Windows）
          python3 << 'PYEOF'
import re, os
version = os.environ["VERSION"]
updates = {
    "desktop/package.json": (r'"version": "[^"]*"', f'"version": "{version}"'),
    "python/pyproject.toml": (r'^version = ".*"', f'version = "{version}"'),
    "Cargo.toml": (r'^version = ".*"', f'version = "{version}"'),
}
for fp, (pat, repl) in updates.items():
    with open(fp, "r") as f:
        content = f.read()
    content = re.sub(pat, repl, content, count=1, flags=re.MULTILINE)
    with open(fp, "w") as f:
        f.write(content)
    print(f"Updated {fp} -> {version}")
PYEOF

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-build.txt

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Electron dependencies
        run: |
          cd desktop
          npm install

      - name: Generate preset data
        working-directory: scripts
        run: python generate_preset_data.py

      - name: Build Python backend (PyInstaller)
        working-directory: python
        run: pyinstaller pyinstaller.spec --clean --noconfirm
        env:
          PYTHONIOENCODING: utf-8

      - name: Copy backend artifacts (Windows)
        if: matrix.platform == 'win'
        run: |
          if not exist "desktop\backend" mkdir "desktop\backend"
          copy "python\dist\finhack-backend.exe" "desktop\backend\finhack-backend.exe"
        shell: cmd

      - name: Copy backend artifacts (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p desktop/backend
          cp python/dist/finhack-backend desktop/backend/finhack-backend

      - name: List backend files
        run: |
          if [ -d "desktop/backend" ]; then ls -la desktop/backend/; else echo "Backend directory not found"; fi
        shell: bash

      - name: Build Electron app (${{ matrix.platform }})
        working-directory: desktop
        run: npm run ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist files
        run: |
          if [ -d "desktop/dist" ]; then ls -la desktop/dist/; else echo "Dist directory not found"; fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: |
            desktop/dist/*.${{ matrix.artifact_ext }}
            desktop/dist/*.zip
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute version (for release tag)
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            CURRENT=$(grep '"version"' desktop/package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
            IFS='.' read -ra VER <<< "$CURRENT"
            MAJOR=${VER[0]:-2}
            MINOR=${VER[1]:-1}
            PATCH=${VER[2]:-0}
            case "${{ inputs.release_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              auto|*)
                DATE=$(date +'%Y%m%d')
                TIME=$(date +'%H%M')
                VERSION="${MAJOR}.${MINOR}.${PATCH}+${DATE}.${TIME}"
                echo "version=$VERSION" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-win
          path: dist/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-mac
          path: dist/mac

      - name: List downloaded artifacts
        run: find dist -type f | sort

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FinHack Pro v${{ steps.version.outputs.version }}
          body: |
            ## FinHack Pro v${{ steps.version.outputs.version }}

            ### Downloads
            - **Windows**: NSIS installer (`.exe`)
            - **macOS**: DMG image (`.dmg`)

            ### Installation
            - **Windows**: Download the `.exe` file and run it to install.
            - **macOS**: Download the `.dmg` file, open it, and drag the app to Applications.

            > **Note for macOS users**: If you see a "cannot be opened" warning,
            > right-click the app and select Open, or go to System Preferences >
            > Security & Privacy and allow the app.
          draft: false
          prerelease: false
          files: |
            dist/win/*.exe
            dist/mac/*.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
