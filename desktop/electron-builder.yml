# FinHack Pro Electron Builder 配置
# 多智能体量化交易系统桌面版打包配置

appId: com.finhack.pro
productName: FinHack Pro
copyright: Copyright (c) 2024 FinHack Team

# 目录配置
directories:
  output: dist
  buildResources: assets

# 文件包含配置
files:
  - "src/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

# 额外资源 - 包含Python后端
extraResources:
  - from: "backend"
    to: "backend"
    filter:
      - "**/*"
  - from: "assets"
    to: "assets"
    filter:
      - "**/*"

# Windows 配置
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: assets/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

# NSIS 安装程序配置
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FinHack Pro
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"
  license: LICENSE

# macOS 配置
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  iconSize: 100
  iconTextSize: 12

# Linux 配置
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  category: Office
  maintainer: FinHack Team
  desktop:
    Name: FinHack Pro
    Comment: 多智能体量化交易系统
    Categories: Office;Finance;
    StartupWMClass: finhack-pro

# 发布配置
publish:
  provider: generic
  url: https://releases.finhack.pro

# 更新配置
updater:
  enabled: true
  endpoints:
    - https://releases.finhack.pro/update/${platform}/${arch}/${version}
