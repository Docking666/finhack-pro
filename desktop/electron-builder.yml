# FinHack Pro Electron Builder 配置
appId: com.finhack.pro
productName: FinHack Pro
copyright: Copyright (c) 2024 FinHack Team

# 使用镜像加速 Electron 下载，避免 DNS 临时故障
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

directories:
  output: dist
  buildResources: assets

files:
  - "src/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

extraResources:
  - from: "backend"
    to: "backend"
    filter:
      - "**/*"
  - from: "assets"
    to: "assets"
    filter:
      - "**/*"
  - from: "../scripts/setup_env.py"
    to: "scripts/setup_env.py"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FinHack Pro
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  window:
    width: 540
    height: 380
